<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ReadMe</title>
  <meta name="theme-color" content="#FAF5ED" />
  <link rel="icon" href="brand/symbol.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="demo-bar" hidden>
    Демо: я
    <button data-demo="demoA">Аня</button>
    <button data-demo="demoB">Боря</button>
  </div>
  <header id="brand"><div class="in"><img src="brand/symbol.svg" alt="" /><span class="word">Read<span>Me</span></span><span id="brand-note">прочитай меня</span></div></header>
  <main id="app"><div class="center muted">Загрузка…</div></main>
  <nav id="tabs" hidden>
    <button data-tab="game" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z"/></svg>Главная</button>
    <button data-tab="daily"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Страница дня</button>
    <button data-tab="side"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19l1-4 9.5-9.5a2.1 2.1 0 0 1 3 3L9 18z"/><path d="M13.5 7.5l3 3"/></svg>Мои слова</button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 4 5v13c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5c-3-.5-6 0-8 1.5z"/><path d="M12 6.5V19"/></svg>Наша книга</button>
  </nav>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
