<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ReadMe</title>
  <meta name="theme-color" content="#FAF5ED" />
  <link rel="icon" href="brand/symbol.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="demo-bar" hidden>
    Демо: я
    <button data-demo="demoA">Аня</button>
    <button data-demo="demoB">Боря</button>
  </div>
  <header id="brand"><div class="in"><img src="brand/symbol.svg" alt="" /><span class="word">Read<span>Me</span></span><span id="brand-note">прочитай меня</span></div></header>
  <main id="app"><div class="center muted">Загрузка…</div></main>
  <nav id="tabs" hidden>
    <button data-tab="game" class="active"><span>💬</span>Разговор</button>
    <button data-tab="daily"><span>☀️</span>День</button>
    <button data-tab="side"><span>💌</span>Мои слова</button>
    <button data-tab="tone"><span>🎚️</span>Тон</button>
    <button data-tab="history"><span>📖</span>Наша книга</button>
  </nav>
  <div id="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
